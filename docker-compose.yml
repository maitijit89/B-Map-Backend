version: '3.8'

services:
  # MongoDB Geospatial Database (with 2dsphere indexing)
  mongodb:
    image: mongo:7.0
    container_name: bmap_mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: b_map_navigation
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Real-Time Geo Layer (GEOADD, GEOSEARCH, route cache)
  redis:
    image: redis:7-alpine
    container_name: bmap_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # B-Map Navigation Express & Socket.IO API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bmap_api
    restart: always
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      NODE_ENV: production
      API_PREFIX: /api/v1
      MONGODB_URI: mongodb://mongodb:27017/b_map_navigation
      REDIS_URL: redis://redis:6379
      OSRM_BASE_URL: https://router.project-osrm.org
      CORS_ORIGIN: '*'
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongodb_data:
  redis_data:
